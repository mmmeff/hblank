[workspace]
members = [
    "crates/hblank",
    "crates/hblank-cli",
    "crates/hblank-core",
    "crates/hblank-macros",
    "fixtures/dogfood",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mmmeff/hblank"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
globset = "0.4.18"
gpui = "0.2.2"
inventory = "0.3.21"
notify = "8.2.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0.111", features = ["full", "extra-traits"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
toml = "0.9.8"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
