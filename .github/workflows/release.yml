name: Release

on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic release and crates.io publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify pre-1.0 release baseline
        shell: bash
        run: |
          root_commit="$(git rev-list --max-parents=0 HEAD)"
          baseline_commit="$(git rev-list -n 1 v0.0.0 2>/dev/null || true)"
          if [[ "$baseline_commit" != "$root_commit" ]]; then
            echo "::error::Tag v0.0.0 must point to the repository root commit before the first release. Run scripts/setup-release.sh."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Set up stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          cache-targets: "true"
          cache-on-failure: "true"

      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libx11-xcb-dev \
            libxkbcommon-x11-dev

      - name: Verify workspace
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked

      - name: Request crates.io trusted-publishing token
        id: crates-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Configure crates.io credentials
        shell: bash
        env:
          TRUSTED_TOKEN: ${{ steps.crates-auth.outputs.token }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -n "$BOOTSTRAP_TOKEN" ]]; then
            token="$BOOTSTRAP_TOKEN"
            echo "Using the crates.io bootstrap token"
          elif [[ -n "$TRUSTED_TOKEN" ]]; then
            token="$TRUSTED_TOKEN"
            echo "Using a short-lived crates.io trusted-publishing token"
          else
            echo "::error::No crates.io credential is available. Run scripts/setup-release.sh."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'CARGO_REGISTRY_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Resume incomplete crates.io publication
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace\.package\]$/,/^\[/ s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          if [[ "$version" != "0.0.0" ]] && git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            bash scripts/publish-crates.sh "$version"
          else
            echo "No tagged workspace version needs publication recovery"
          fi

      - name: Publish missing GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-github-releases.sh

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
